quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=postgres
quarkus.datasource.password=postgres
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/library

quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=true

# GraphQL endpoint
quarkus.smallrye-graphql.root-path=/graphql
quarkus.smallrye-graphql.enable-ui=true

# Quinoa static UI
quarkus.quinoa.package-manager-install=false
quarkus.quinoa.ui-root-path=quinoa
quarkus.quinoa.index-page=true

# Keycloak placeholder for future auth integration
quarkus.oidc.auth-server-url=http://localhost:8080/realms/library
quarkus.oidc.client-id=library-backend
quarkus.oidc.credentials.secret=secret
quarkus.oidc.application-type=service
